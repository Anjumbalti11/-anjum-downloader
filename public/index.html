<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Anjum Downloader - Pro</title>

<!-- Favicon & PWA -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff6a00'/%3E%3Cpath d='M50 20 L50 70 M30 50 L50 70 L70 50 M20 80 L80 80' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;transition:background .3s,color .3s;-webkit-tap-highlight-color:transparent}
  
  /* DARK THEME (Default) */
  :root{--bg:#0a0a0f;--card:#14141d;--line:#262633;--text:#f4f4f8;--dim:#8e8e9e;--ac:#ffb300;--ac2:#ff7a00;--ok:#2ecc71;--pu:#b57edc;--err:#ff4d4d;--header:rgba(10,10,15,0.9)}
  
  /* LIGHT THEME */
  html[data-theme="light"]{--bg:#f5f5f7;--card:#ffffff;--line:#e0e0e0;--text:#1a1a1a;--dim:#666666;--header:rgba(245,245,247,0.9)}
  
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px;display:flex;flex-direction:column;overflow-x:hidden}
  
  /* Top Bar */
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:var(--bg);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);background:var(--header)}
  .menu-btn{font-size:1.5rem;color:var(--ac);cursor:pointer;background:none;border:none;margin-right:10px}
  .logo{font:900 1.3rem Impact,sans-serif;transform:skewX(-8deg);letter-spacing:1px}
  .logo b{color:var(--ac)}
  .header-right{display:flex;align-items:center;gap:15px}
  .theme-btn{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer}
  .status-badge{font-size:10px;background:rgba(46,204,113,0.15);color:var(--ok);padding:4px 10px;border-radius:12px;font-weight:800;letter-spacing:0.5px;border:1px solid rgba(46,204,113,0.3)}

  /* Sidebar */
  .sidebar{position:fixed;top:0;left:-270px;width:270px;height:100vh;background:var(--card);z-index:1000;transition:left 0.3s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:5px 0 25px rgba(0,0,0,0.8);padding-top:20px}
  .sidebar.open{left:0}
  .sidebar-header{display:flex;justify-content:space-between;align-items:center;padding:0 20px 20px;border-bottom:1px solid var(--line)}
  .sidebar-header h2{font-size:1.2rem;color:var(--ac);font-weight:800}
  .close-btn{font-size:1.2rem;color:var(--dim);cursor:pointer;background:none;border:none}
  .sidebar-links{padding:20px 10px;display:flex;flex-direction:column;gap:5px}
  .sidebar-links a, .sidebar-links button{display:flex;align-items:center;gap:12px;padding:14px 15px;color:var(--text);text-decoration:none;border-radius:10px;font-weight:600;font-size:0.95rem;width:100%;text-align:left;cursor:pointer;background:none;border:none;transition:0.2s}
  .sidebar-links a:hover, .sidebar-links button:hover{background:rgba(255,179,0,0.1);color:var(--ac)}
  .sidebar-links i{width:20px;text-align:center;color:var(--dim);font-size:1.1rem}
  .sidebar-links a:hover i, .sidebar-links button:hover i{color:var(--ac)}
  .sidebar-links .active{background:rgba(255,179,0,0.15);color:var(--ac)}
  .sidebar-links .active i{color:var(--ac)}
  .divider{height:1px;background:var(--line);margin:10px 0}

  /* Overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;display:none;backdrop-filter:blur(2px)}
  .overlay.open{display:block}

  /* Main Content */
  .container{max-width:700px;margin:0 auto;padding:20px;width:100%}
  
  /* Input Area */
  .input-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:25px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
  
  .platform-icons{display:flex;justify-content:center;gap:20px;margin-bottom:15px;font-size:1.5rem;color:var(--dim)}
  .platform-icons i{transition:0.3s; cursor:pointer}
  .platform-icons i.active{color:var(--ac); transform:scale(1.2); text-shadow:0 0 15px rgba(255,179,0,0.5)}
  
  .input-wrapper{position:relative;width:100%}
  textarea{width:100%;height:80px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 70px 18px 18px;color:var(--text);font-size:14px;resize:none;outline:none;margin-bottom:15px;transition:0.3s}
  textarea:focus{border-color:var(--ac);box-shadow:0 0 10px rgba(255,179,0,0.1)}
  .paste-btn{position:absolute;right:12px;top:14px;background:var(--card);border:1px solid var(--line);color:var(--ac);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;transition:0.2s}
  .paste-btn:hover{background:var(--ac);color:#000}
  
  .btn-get{width:100%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:1.05rem;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:0.3s}
  .btn-get:hover{transform:scale(1.01);box-shadow:0 5px 15px rgba(255,179,0,0.3)}
  .btn-get:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
  
  /* Loader */
  .loader{display:none;text-align:center;padding:30px;color:var(--ac)}
  .loader i{font-size:2.5rem;margin-bottom:15px;animation:spin 1s linear infinite}
  .loader p{font-size:14px;font-weight:600;color:var(--dim)}
  @keyframes spin{100%{transform:rotate(360deg)}}

  /* Result Area */
  .result{display:none;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:30px;box-shadow:0 15px 35px rgba(0,0,0,0.2); animation: fadeIn 0.5s;}
  @keyframes fadeIn {from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  
  .video-preview{width:100%;aspect-ratio:16/9;background:#000;position:relative; display:flex; justify-content:center; align-items:center;}
  .video-preview video{width:100%; height:100%; object-fit:contain;}
  .video-preview img{width:100%;height:100%;object-fit:cover}
  
  .thumb-info{position:absolute;bottom:0;left:0;right:0;padding:25px 20px 15px;background:linear-gradient(transparent,rgba(0,0,0,0.95));color:#fff;}
  .thumb-info h3{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  
  .btns{display:flex;gap:12px;padding:20px;flex-wrap:wrap}
  .btn-dl{flex:1;min-width:130px;padding:15px;border-radius:12px;text-decoration:none;text-align:center;font-weight:800;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;transition:0.2s;border:none;}
  .btn-dl:hover{transform:translateY(-2px)}
  .btn-mp4{background:var(--ok);color:#fff;box-shadow:0 4px 15px rgba(46,204,113,0.3)}
  .btn-mp3{background:var(--pu);color:#fff;box-shadow:0 4px 15px rgba(181,126,220,0.3)}
  .btn-copy{background:var(--card);border:1px solid var(--ac);color:var(--ac);flex:none;padding:15px 25px}
  .btn-copy:hover{background:rgba(255,179,0,0.1)}

  /* History Section */
  .saved-section{margin-top:20px}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
  .section-header h2{font-size:18px;color:var(--ac);display:flex;align-items:center;gap:10px}
  .clear-btn{background:rgba(255,77,77,0.1);color:var(--err);border:1px solid var(--err);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
  .clear-btn:hover{background:var(--err);color:#fff}
  
  .saved-list{display:flex;flex-direction:column;gap:12px}
  .saved-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:15px}
  .saved-item img{width:90px;height:55px;object-fit:cover;border-radius:10px;background:#000}
  .saved-item div{flex:1;min-width:0}
  .saved-item h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;font-weight:700}
  .saved-item a{font-size:12px;color:var(--ok);text-decoration:none;font-weight:800;margin-right:15px}
  .saved-item .del{color:var(--err);cursor:pointer;font-size:16px;padding:5px}
  .saved-item .del:hover{transform:scale(1.2)}

  /* Toast Notification */
  .toast{position:fixed;bottom:-100px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:14px 28px;border-radius:30px;font-size:14px;font-weight:700;transition:0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:9999;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.3);opacity:0;width:90%;max-width:400px;}
  .toast.show{bottom:30px;opacity:1}
  .toast.err{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div style="display:flex;align-items:center">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="logo">ANJUM<b>DOWNLOADER</b></div>
  </div>
  <div class="header-right">
      <button class="theme-btn" onclick="toggleTheme()" id="themeIcon"><i class="fas fa-moon"></i></button>
      <div class="status-badge"><i class="fas fa-circle" style="font-size:6px;margin-right:4px"></i>LIVE</div>
  </div>
</div>

<!-- Sidebar -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Menu</h2>
    <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
  </div>
  <div class="sidebar-links">
    <a href="#" class="active"><i class="fas fa-download"></i> Social Downloader</a>
    <a href="https://anjumstream.site.je/" target="_blank"><i class="fas fa-play-circle"></i> Go to AnjumStream</a>
    <div class="divider"></div>
    <button onclick="clearAllHistory()"><i class="fas fa-trash-alt"></i> Clear History</button>
    <a href="#" onclick="showToast('Tap 3 dots > Add to Home Screen to install App', 'ok')"><i class="fas fa-mobile-alt"></i> Install App</a>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  
  <!-- Input Area -->
  <div class="input-box">
    <div class="platform-icons" id="platformIcons">
        <i class="fab fa-tiktok" data-platform="tiktok" title="TikTok"></i>
        <i class="fab fa-instagram" data-platform="instagram" title="Instagram"></i>
        <i class="fab fa-facebook" data-platform="facebook" title="Facebook"></i>
        <i class="fab fa-vimeo-v" data-platform="vimeo" title="Vimeo"></i>
        <i class="fas fa-file-video" data-platform="mp4" title="Direct MP4"></i>
    </div>
    <p style="font-size:13px;color:var(--dim);margin-bottom:15px;text-align:center;font-weight:600">Paste Link to download directly</p>
    
    <div class="input-wrapper">
        <textarea id="urlInput" placeholder="Paste TikTok, Instagram, FB, ya Direct MP4 link here..." oninput="detectPlatform()"></textarea>
        <button class="paste-btn" onclick="pasteLink()">Paste</button>
    </div>
    
    <button class="btn-get" id="mainBtn" onclick="processMedia()"><i class="fas fa-bolt"></i> Generate Download Links</button>
  </div>

  <!-- Loading -->
  <div class="loader" id="loader">
    <i class="fas fa-circle-notch"></i>
    <p id="loadText">Fetching high-quality links... Please wait.</p>
  </div>

  <!-- Result Section -->
  <div class="result" id="resultBox">
    <div class="video-preview" id="previewContainer">
      <img id="resThumb" src="" alt="Thumbnail">
      <div class="thumb-info">
          <h3 id="resTitle">Video Title</h3>
      </div>
    </div>
    
    <div class="btns">
      <a href="#" id="dlMp4" target="_blank" class="btn-dl btn-mp4"><i class="fas fa-video"></i> Save MP4</a>
      <a href="#" id="dlMp3" target="_blank" class="btn-dl btn-mp3"><i class="fas fa-music"></i> Save MP3</a>
      <button onclick="copyCurrentLink()" class="btn-dl btn-copy" title="Copy Video Link"><i class="fas fa-copy"></i></button>
    </div>
  </div>

  <!-- History Section -->
  <div class="saved-section">
    <div class="section-header">
        <h2><i class="fas fa-bookmark"></i> Saved Media</h2>
        <button class="clear-btn" onclick="clearAllHistory()">Clear All</button>
    </div>
    <div class="saved-list" id="savedList">
        <p style="color:var(--dim);font-size:13px;text-align:center;padding:20px;">Koi media save nahi kiya gaya.</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">Message</div>

<script>
// 🔴 NAYA FEATURE: Khud API URL detect karega (Wasmer Domain)
const API_URL = window.location.origin; 

let savedMedia = JSON.parse(localStorage.getItem('anjum_saved_media') || '[]');
let currentVideoLink = '';
let currentAudioLink = '';

// --- 1. Theme Toggle Logic ---
const savedTheme = localStorage.getItem('app_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('app_theme', next);
    updateThemeIcon(next);
}
function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    icon.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}

// --- 2. Smart Platform Highlighter ---
function detectPlatform() {
    const url = document.getElementById('urlInput').value.toLowerCase();
    const icons = document.querySelectorAll('.platform-icons i');
    
    icons.forEach(i => i.classList.remove('active'));
    
    if(url.includes('tiktok.com')) document.querySelector('[data-platform="tiktok"]').classList.add('active');
    else if(url.includes('instagram.com')) document.querySelector('[data-platform="instagram"]').classList.add('active');
    else if(url.includes('facebook.com') || url.includes('fb.watch')) document.querySelector('[data-platform="facebook"]').classList.add('active');
    else if(url.includes('vimeo.com')) document.querySelector('[data-platform="vimeo"]').classList.add('active');
    else if(url.endsWith('.mp4') || url.includes('m3u8')) document.querySelector('[data-platform="mp4"]').classList.add('active');
}

// --- 3. Auto-Share Feature (App Integration) ---
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const sharedUrl = urlParams.get('url');
    if (sharedUrl) {
        document.getElementById('urlInput').value = sharedUrl;
        detectPlatform();
        processMedia(); 
    }
});

// --- 4. Sidebar Toggle ---
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

// --- 5. Paste & Copy Logic ---
async function pasteLink() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
        detectPlatform();
        showToast('✅ Link Pasted!', 'ok');
    } catch (err) {
        showToast('⚠️ Allow clipboard access to paste.', 'err');
    }
}

function copyCurrentLink() {
    if(!currentVideoLink) return;
    navigator.clipboard.writeText(currentVideoLink).then(() => {
        showToast('✅ Direct Link Copied!', 'ok');
    });
}

// --- 6. Render History ---
function renderSaved() {
    const list = document.getElementById('savedList');
    if (savedMedia.length === 0) {
        list.innerHTML = '<p style="color:var(--dim);font-size:13px;text-align:center;padding:20px;">Koi media save nahi kiya gaya.</p>';
        return;
    }
    list.innerHTML = savedMedia.map((item, index) => `
        <div class="saved-item">
            <img src="${item.thumb}" alt="thumb" onerror="this.src='https://via.placeholder.com/150'">
            <div>
                <h4>${item.title}</h4>
                <a href="${item.video_url}" target="_blank"><i class="fas fa-video"></i> Video</a>
                ${item.audio_url ? `<a href="${item.audio_url}" target="_blank" style="color:var(--pu)"><i class="fas fa-music"></i> Audio</a>` : ''}
            </div>
            <i class="fas fa-trash del" onclick="deleteSaved(${index})" title="Remove"></i>
        </div>
    `).join('');
}

function deleteSaved(index) {
    savedMedia.splice(index, 1);
    localStorage.setItem('anjum_saved_media', JSON.stringify(savedMedia));
    renderSaved();
    showToast('🗑️ Removed from History', 'ok');
}

function clearAllHistory() {
    if(savedMedia.length === 0) return showToast('History already empty!', 'ok');
    if(confirm("Kya aap saari history delete karna chahte hain?")) {
        savedMedia = [];
        localStorage.setItem('anjum_saved_media', JSON.stringify([]));
        renderSaved();
        if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        showToast('🗑️ History Cleared!', 'ok');
    }
}

// --- 7. Main API Call ---
async function processMedia() {
    let url = document.getElementById('urlInput').value.trim();
    
    // Reset UI
    document.getElementById('resultBox').style.display = 'none';
    
    if (!url) return showToast('⚠️ Paste a link first!', 'err');
    if(url.includes('youtube.com') || url.includes('youtu.be')) {
        return showToast('❌ YouTube links are blocked.', 'err');
    }

    // Smart Cleaner
    if (url.includes('tiktok.com') || url.includes('instagram.com')) {
        url = url.replace(/\.mp4$/i, ''); 
    }

    const btn = document.getElementById('mainBtn');
    const loader = document.getElementById('loader');
    const loadText = document.getElementById('loadText');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching...';
    loader.style.display = 'block';
    loadText.innerText = "Connecting to Server...";

    setTimeout(() => { if(btn.disabled) loadText.innerText = "Extracting media links..." }, 2000);
    setTimeout(() => { if(btn.disabled) loadText.innerText = "Almost done..." }, 4000);

    try {
        const res = await fetch(`${API_URL}/api/download?url=${encodeURIComponent(url)}`);
        const textData = await res.text();
        
        let data;
        try {
            data = JSON.parse(textData);
        } catch(e) {
            throw new Error("Server returned an invalid response. Backend may be down.");
        }

        if (data.error) throw new Error(data.error);

        // Set Data
        currentVideoLink = data.video_url || '';
        currentAudioLink = data.audio_url || '';
        
        // NAYA FEATURE: Video Preview Player
        const previewContainer = document.getElementById('previewContainer');
        if(currentVideoLink) {
            previewContainer.innerHTML = `
                <video src="${currentVideoLink}" controls poster="${data.thumbnail || ''}" playsinline></video>
                <div class="thumb-info"><h3>${data.title || 'Media File'}</h3></div>
            `;
        } else {
            previewContainer.innerHTML = `
                <img src="${data.thumbnail || 'https://via.placeholder.com/600x300?text=No+Thumbnail'}" alt="Thumbnail">
                <div class="thumb-info"><h3>${data.title || 'Media File'}</h3></div>
            `;
        }
        
        document.getElementById('dlMp4').href = currentVideoLink || '#';
        document.getElementById('dlMp3').href = currentAudioLink || '#';

        document.getElementById('dlMp4').style.display = currentVideoLink ? 'flex' : 'none';
        document.getElementById('dlMp3').style.display = currentAudioLink ? 'flex' : 'none';

        document.getElementById('resultBox').style.display = 'block';

        // Save to History
        const newItem = {
            title: data.title || 'Media File',
            thumb: data.thumbnail || 'https://via.placeholder.com/150',
            video_url: currentVideoLink,
            audio_url: currentAudioLink
        };
        
        savedMedia.unshift(newItem);
        if(savedMedia.length > 15) savedMedia.pop();
        localStorage.setItem('anjum_saved_media', JSON.stringify(savedMedia));
        renderSaved();
        
        showToast('✅ Links Generated!', 'ok');

    } catch (e) {
        showToast(`❌ ${e.message}`, 'err');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bolt"></i> Generate Download Links';
        loader.style.display = 'none';
    }
}

// --- 8. Toast Notifications ---
let toastTimer;
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'toast show';
  if(type === 'err') t.classList.add('err');
  
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// Init
renderSaved();
</script>
</body>
</html>
