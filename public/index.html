<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anjum Downloader</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff6a00'/%3E%3Cpath d='M50 20 L50 70 M30 50 L50 70 L70 50 M20 80 L80 80' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* CSS SAME AS PREVIOUS */
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  :root{--bg:#0a0a0f;--card:#14141d;--line:#262633;--text:#f4f4f8;--dim:#8e8e9e;--ac:#ffb300;--ac2:#ff7a00;--ok:#2ecc71;--pu:#b57edc}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px;display:flex;flex-direction:column}
  
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:var(--bg);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
  .menu-btn{font-size:1.5rem;color:var(--ac);cursor:pointer;background:none;border:none}
  .logo{font:900 1.2rem Impact,sans-serif;transform:skewX(-8deg)}
  .logo b{color:var(--ac)}

  .sidebar{position:fixed;top:0;left:-250px;width:250px;height:100vh;background:var(--card);z-index:1000;transition:left 0.3s ease;box-shadow:5px 0 15px rgba(0,0,0,0.5);padding-top:20px}
  .sidebar.open{left:0}
  .sidebar-header{display:flex;justify-content:space-between;align-items:center;padding:0 20px 20px;border-bottom:1px solid var(--line)}
  .sidebar-header h2{font-size:1.2rem;color:var(--ac)}
  .close-btn{font-size:1.2rem;color:var(--dim);cursor:pointer;background:none;border:none}
  .sidebar-links{padding:20px 10px;display:flex;flex-direction:column;gap:5px}
  .sidebar-links a{display:flex;align-items:center;gap:10px;padding:12px 15px;color:var(--text);text-decoration:none;border-radius:8px;font-weight:600;font-size:0.95rem;transition:0.2s}
  .sidebar-links a:hover{background:var(--bg);color:var(--ac)}
  .sidebar-links a i{width:20px;text-align:center;color:var(--dim)}
  .sidebar-links a.active{background:rgba(255,179,0,0.1);color:var(--ac)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:none}
  .overlay.open{display:block}

  .container{max-width:700px;margin:0 auto;padding:20px;width:100%}
  .input-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .input-box p{font-size:13px;color:var(--dim);margin-bottom:10px;text-align:center}
  textarea{width:100%;height:70px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:15px;color:var(--text);font-size:14px;resize:none;outline:none;margin-bottom:10px}
  textarea:focus{border-color:var(--ac)}
  .btn-get{width:100%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;padding:15px;border-radius:12px;border:none;font-weight:900;font-size:1rem;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
  .btn-get:disabled{opacity:0.5;cursor:not-allowed}
  
  .loader{display:none;text-align:center;padding:20px;color:var(--ac)}
  .loader i{font-size:2rem;margin-bottom:10px;animation:spin 1s linear infinite}
  @keyframes spin{100%{transform:rotate(360deg)}}

  .result{display:none;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:30px}
  .thumb{width:100%;aspect-ratio:16/9;background:#000;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb h3{position:absolute;bottom:0;left:0;right:0;padding:20px 15px 10px;background:linear-gradient(transparent,#000);color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btns{display:flex;gap:10px;padding:15px}
  .btn-dl{flex:1;padding:12px;border-radius:10px;text-decoration:none;text-align:center;font-weight:800;font-size:13px;display:flex;justify-content:center;align-items:center;gap:5px}
  .btn-mp4{background:var(--ok);color:#fff}
  .btn-mp3{background:var(--pu);color:#fff}

  .saved-section{margin-top:20px}
  .saved-section h2{font-size:18px;margin-bottom:15px;color:var(--ac);display:flex;align-items:center;gap:8px}
  .saved-list{display:flex;flex-direction:column;gap:10px}
  .saved-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px}
  .saved-item img{width:80px;height:50px;object-fit:cover;border-radius:8px}
  .saved-item div{flex:1;min-width:0}
  .saved-item h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
  .saved-item a{font-size:11px;color:var(--ok);text-decoration:none;font-weight:700;margin-right:10px}
  .saved-item .del{color:#ff4d4d;cursor:pointer;font-size:14px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--ac);padding:12px 24px;border-radius:30px;font-size:14px;font-weight:700;transition:0.3s;z-index:999}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top-bar">
  <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="logo">ANJUM<b>DOWNLOADER</b></div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Menu</h2>
    <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
  </div>
  <div class="sidebar-links">
    <a href="#" class="active"><i class="fas fa-download"></i> Social Downloader</a>
    <a href="https://anjumstream.site.je/" target="_blank"><i class="fas fa-play-circle"></i> Go to AnjumStream</a>
    <a href="#" onclick="showToast('Coming soon!')"><i class="fas fa-history"></i> History</a>
    <a href="#" onclick="showToast('Coming soon!')"><i class="fas fa-cog"></i> Settings</a>
  </div>
</div>

<div class="container">
  <div class="input-box">
    <p>Paste TikTok, Instagram, Facebook, Vimeo, ya Direct MP4 link</p>
    <textarea id="urlInput" placeholder="Example: https://vm.tiktok.com/... ya https://instagram.com/reel/..."></textarea>
    <button class="btn-get" id="mainBtn" onclick="processMedia()"><i class="fas fa-bolt"></i> Generate Download Links</button>
  </div>

  <div class="loader" id="loader">
    <i class="fas fa-circle-notch"></i>
    <p>Fetching high-quality links...</p>
  </div>

  <div class="result" id="resultBox">
    <div class="thumb">
      <img id="resThumb" src="" alt="Thumb">
      <h3 id="resTitle">Title</h3>
    </div>
    <div class="btns">
      <a href="#" id="dlMp4" target="_blank" class="btn-dl btn-mp4"><i class="fas fa-video"></i> Save Video</a>
      <a href="#" id="dlMp3" target="_blank" class="btn-dl btn-mp3"><i class="fas fa-music"></i> Save Audio</a>
    </div>
  </div>

  <div class="saved-section">
    <h2><i class="fas fa-bookmark"></i> My Saved Media</h2>
    <div class="saved-list" id="savedList"></div>
  </div>
</div>

<div class="toast" id="toast">Message</div>

<script>
// 🔴 YAHAN APNA NAYA WASMER URL DALEIN 🔴
const API_URL = 'https://anjum-downloader313.wasmer.app'; 

let savedMedia = JSON.parse(localStorage.getItem('anjum_saved_media') || '[]');

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

function renderSaved() {
    const list = document.getElementById('savedList');
    if (savedMedia.length === 0) {
        list.innerHTML = '<p style="color:var(--dim);font-size:12px;">Koi media save nahi kiya gaya.</p>';
        return;
    }
    list.innerHTML = savedMedia.map((item, index) => `
        <div class="saved-item">
            <img src="${item.thumb}" alt="thumb">
            <div>
                <h4>${item.title}</h4>
                <a href="${item.video_url}" target="_blank">⬇ Video</a>
                ${item.audio_url ? `<a href="${item.audio_url}" target="_blank" style="color:var(--pu)">⬇ Audio</a>` : ''}
            </div>
            <i class="fas fa-trash del" onclick="deleteSaved(${index})"></i>
        </div>
    `).join('');
}

function deleteSaved(index) {
    savedMedia.splice(index, 1);
    localStorage.setItem('anjum_saved_media', JSON.stringify(savedMedia));
    renderSaved();
}

async function processMedia() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return showToast('⚠️ Paste a link first!');
    
    if(url.includes('youtube.com') || url.includes('youtu.be')) {
        return showToast('❌ YouTube links are not supported here.');
    }

    const btn = document.getElementById('mainBtn');
    const loader = document.getElementById('loader');
    const resBox = document.getElementById('resultBox');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Please wait...';
    loader.style.display = 'block';
    resBox.style.display = 'none';

    try {
        let endpoint = '/api/social'; // Default for TikTok/Insta
        if (url.endsWith('.mp4') || url.endsWith('.mp3')) {
            endpoint = '/api/direct';
        }

        const res = await fetch(`${API_URL}${endpoint}?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('resThumb').src = data.thumbnail || 'https://via.placeholder.com/600x300?text=No+Thumbnail';
        document.getElementById('resTitle').innerText = data.title || 'Media File';
        
        document.getElementById('dlMp4').href = data.video_url || '#';
        document.getElementById('dlMp3').href = data.audio_url || '#';

        if(!data.audio_url) document.getElementById('dlMp3').style.display = 'none';
        else document.getElementById('dlMp3').style.display = 'flex';

        if(!data.video_url) document.getElementById('dlMp4').style.display = 'none';
        else document.getElementById('dlMp4').style.display = 'flex';

        resBox.style.display = 'block';

        const newItem = {
            title: data.title || 'Media File',
            thumb: data.thumbnail || 'https://via.placeholder.com/150',
            video_url: data.video_url,
            audio_url: data.audio_url
        };
        savedMedia.unshift(newItem);
        if(savedMedia.length > 10) savedMedia.pop();
        localStorage.setItem('anjum_saved_media', JSON.stringify(savedMedia));
        renderSaved();
        
        showToast('✅ Media Saved!');

    } catch (e) {
        showToast('❌ Error: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bolt"></i> Generate Download Links';
        loader.style.display = 'none';
    }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

renderSaved();
</script>
</body>
</html>
